<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>컴퓨터소프트웨어전공</title>

    <style>
        body{
            width: 700px;
            margin: 10px auto;
        }

        #middle{
            overflow: hidden;
        }

        #left{
            float: left;
            width: 500px;
            background: white;
        }

        #right{
            float: right;
            width: 200px;
            background: #e6f0f7;
        }

        #top{
            background: #203f66;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #bottom{
            background: #26343b;
            color: white;
            text-align: center;
            padding: 20px;
        }

        #menu{
            background: #32658f;
            overflow: hidden;
        }

        #menu div{
            float: left;
            width: 20%;
            color: white;
            text-align: center;
            padding: 12px 0;
        }

        #left h2{
            color: #203f66;
        }

        #right h3{
            color: #203f66;
        }

        #right div{
            background: white;
            border: 1px solid #ccc;
            padding: 8px;
        }
    </style>
</head>

<body>

    <div id="top">
        <h1>COMPUTER SOFTWARE</h1>
        <p>Daegu University Web Programming</p>
    </div>

    <div id="menu">
        <div>HOME</div>
        <div>전공소개</div>
        <div>교과과정</div>
        <div>교수소개</div>
        <div>CONTACT</div>
    </div>

    <div id="middle">

        <div id="left">
            <h2>전공 소개</h2>

            <p>
                컴퓨터소프트웨어전공에서는 웹, 인공지능, 게임 및 소프트웨어 개발 등을 학습합니다.
            </p>

            <p>
                다양한 프로그래밍 언어와 소프트웨어 기술을 활용하여 실제 문제를 해결하는 방법을 학습합니다.
            </p>
        </div>

        <div id="right">
            <h3>QUICK MENU</h3>

            <div>공지사항</div>
            <div>학사안내</div>
            <div>장학안내</div>
            <div>취업정보</div>
        </div>

    </div>

    <div id="bottom">
        Copyright 2026 Daegu University
    </div>

</body>
</html>
