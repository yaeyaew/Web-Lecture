<!DOCTYPE html>
<html>
<head>
    <title>Layout</title>

    <style>
        body{
            width: 500px;
            margin: 10px auto;
        }

        #middle{
            overflow: hidden;
        }

        #left{
            float: left;
            width: 150px;
            background: red;
        }

        #right{
            float: right;
            width: 350px;
            background: blue;
        }

        #top{
            background: green;
        }

        #bottom{
            background: purple;
        }
    </style>
</head>

<body>

    <div id="top">
        <h1>TOP</h1>
    </div>

    <div id="middle">
        <div id="left">
            <h2>LEFT</h2>
        </div>

        <div id="right">
            <h2>RIGHT</h2>
        </div>
    </div>

    <div id="bottom">
        <h2>BOTTOM</h2>
    </div>

</body>
</html>
