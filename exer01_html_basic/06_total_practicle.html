<!DOCTYPE html>
<html>
    <head>
        <title> 나를 소개합니다 </title>
    </head>
    <body>
        <header>
            <h1>나를 소개합니다</h1>
            <p>안녕하세요.</p>
            <p>나는 장예원입니당.</p>
        </header>

        <nav>
            <a bref="intro">소개 </a>
            <a bref="interest"> 관심분야  </a>
            <a bref="schedule"> 학습계획  </a>
            <a bref="contact"> 문의하기  </a>
        </nav>

        <main>
            <section id="intro">
                <h2>소개</h2>
                <p>저는 웹 프로그래밍을 공부하고 있습니당</p>
                <img src="https://search.pstatic.net/common/?src=http%3A%2F%2Fblogfiles.naver.net%2FMjAyNTA0MDNfMTQy%2FMDAxNzQzNjM1NzExNzIx.VdFTRBtrx8q0SSv8fzolbBjJ8Z9W8t-p6XPbYFYptKQg.pVExt07t2FkVtYEU98mq18E-tmb0FbEF08hAJj9ykT0g.JPEG%2FIMG_7257.JPG&type=sc960_832" alt="곰돌이 푸">
            </section>

            <section id="interest">
                <h2>관심 분야</h2>

                <h3>관심있는 기술</h3>
                <p>HTML, CSS</p>

                <h3>학습순서</h3>
                <p>1. HTML 배우기</p>
                <p>2. CSS 배우기</p>
            </section>

            <section id="schedule">
                <h2>학습 계획</h2>

                <table border="1">
                    <tr>
                    <th>주차</th>
                    <th>학습내용</th>
                    <th>상태</th>
                </tr>

                <tr>
                    <td>1주차</td>
                    <td>HTML 기본</td>
                    <td>학습완료</td>
                </tr>

                <tr>
                    <td>2주차</td>
                    <td>CSS 기본</td>
                    <td>학습완료</td>
                </tr>

                <tr>
                    <td>3주차</td>
                    <td>자바스크립트 기본</td>
                    <td>학습진행중</td>
                </tr>
            </table>

            </section>

            <section id="contact">
                <h2>문의하기</h2>

                <form>
                    <fieldset>
                        <legend>문의 양식</legend>

                        <table>
                            <tr>
                                <td><label for="name">이름</label></td>
                                <td><input id="name" type="text"></td>
                            </tr>

                            <tr>
                                <td><label for="mail">이메일</label></td>
                                <td><input id="mail" type="email"></td>
                            </tr>

                            <tr>
                                <td><label for="phone">전화번호</label></td>
                                <td><input id="phone" type="text"></td>
                            </tr>

                            <tr>
                                <td><label for="message">문의내용</label></td>
                                <td><textarea id="message"></textarea></td>
                            </tr>
                        </table>

                        <input type="submit" value="제출">
                    </fieldset>
                </form>
            </section>

        </main>

    </body>
    
</html>
